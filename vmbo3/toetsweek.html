<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5efe4">
<title>Aardrijkskunde Leertool — Toetsweek 3 vmbo-t</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AARDRIJKSKUNDE LEERTOOL — STIJL
   Rustig, leesbaar, mobile-first
   ============================================================ */

:root {
  /* Base palette — warm cream/paper */
  --bg: #f5efe4;
  --bg-card: #fbf7ee;
  --bg-elevated: #ffffff;
  --ink: #2a2620;
  --ink-soft: #5a5347;
  --ink-faint: #8a8270;
  --line: #e6dccb;
  --line-strong: #d4c8b3;

  /* Hoofdstukkleuren (per id) */
  --ocher: #b8842d;          /* H1 */
  --ocher-soft: #ead7af;
  --ocher-bg: #f5e7c4;

  --moss: #5e7c3a;           /* H3 */
  --moss-soft: #c8d4ad;
  --moss-bg: #dde4c4;

  --terracotta: #b85a3c;     /* H5 */
  --terracotta-soft: #e8c0ad;
  --terracotta-bg: #f0d4c3;

  --bordeaux: #8a3a3a;       /* H6 */
  --bordeaux-soft: #d8a8a8;
  --bordeaux-bg: #e8c8c8;

  /* States */
  --good: #4a7c3a;
  --good-bg: #d9e6ce;
  --warn: #c2872d;
  --warn-bg: #f1e2c0;
  --bad:  #b04a4a;
  --bad-bg:  #ecc6c6;

  /* Sizing */
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;

  /* Shadows */
  --shadow-soft: 0 1px 2px rgba(60, 50, 30, 0.04), 0 2px 8px rgba(60, 50, 30, 0.04);
  --shadow-med:  0 2px 6px rgba(60, 50, 30, 0.08), 0 8px 20px rgba(60, 50, 30, 0.06);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  font-feature-settings: 'ss01' on, 'cv11' on;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Subtiele papier-textuur */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(184, 132, 45, 0.03) 0, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(94, 124, 58, 0.03) 0, transparent 50%);
  pointer-events: none;
  z-index: -1;
}

h1, h2, h3, h4 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  margin: 0;
  letter-spacing: -0.01em;
  color: var(--ink);
}

p { margin: 0 0 0.8em 0; }
p:last-child { margin-bottom: 0; }

/* ============================================================
   APP CONTAINER & TOP BAR
   ============================================================ */
.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 16px 100px 16px;
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  padding: 16px 0 12px 0;
  margin: 0 -16px 8px -16px;
  padding-left: 16px;
  padding-right: 16px;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s, box-shadow 0.2s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar.scrolled {
  border-bottom-color: var(--line);
  box-shadow: 0 4px 12px -8px rgba(60, 50, 30, 0.1);
}

.topbar .back {
  background: none;
  border: 1px solid var(--line-strong);
  color: var(--ink-soft);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.topbar .back:hover { background: var(--bg-card); }
.topbar .back:active { transform: translateY(1px); }
.topbar .title {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 17px;
  font-weight: 500;
  flex: 1;
  color: var(--ink);
}
.topbar .badge {
  font-size: 13px;
  color: var(--ink-faint);
  font-weight: 500;
}

/* ============================================================
   VIEW WRAPPERS
   ============================================================ */
.view { display: none; animation: fadeIn 0.25s ease-out; }
.view.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   DASHBOARD
   ============================================================ */
.hero {
  padding: 8px 4px 24px 4px;
}
.hero .eyebrow {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.hero h1 {
  font-size: clamp(28px, 7vw, 38px);
  line-height: 1.1;
  margin-bottom: 6px;
}
.hero .sub {
  color: var(--ink-soft);
  font-size: 15px;
}

.overall-progress {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  margin-bottom: 20px;
}
.overall-progress .label {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.overall-progress .pct {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 36px;
  font-weight: 500;
  line-height: 1;
}
.overall-progress .bar {
  height: 8px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 12px;
}
.overall-progress .bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ocher), var(--moss), var(--terracotta), var(--bordeaux));
  border-radius: 999px;
  transition: width 0.6s ease-out;
}
.overall-progress .stats {
  display: flex;
  gap: 18px;
  margin-top: 14px;
  flex-wrap: wrap;
  font-size: 14px;
  color: var(--ink-soft);
}
.overall-progress .stats span strong {
  color: var(--ink);
  font-weight: 600;
}

.section-title {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 20px;
  margin: 24px 0 12px 0;
}

/* Chapter cards */
.chapter-grid {
  display: grid;
  gap: 12px;
  margin-bottom: 24px;
}
.chapter-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  color: inherit;
  width: 100%;
  display: block;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s, box-shadow 0.15s;
}
.chapter-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-med); }
.chapter-card:active { transform: translateY(0); }
.chapter-card .accent {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 4px;
}
.chapter-card.ocher .accent { background: var(--ocher); }
.chapter-card.moss .accent { background: var(--moss); }
.chapter-card.terracotta .accent { background: var(--terracotta); }
.chapter-card.bordeaux .accent { background: var(--bordeaux); }

.chapter-card .ch-num {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.chapter-card.ocher .ch-num { color: var(--ocher); }
.chapter-card.moss .ch-num { color: var(--moss); }
.chapter-card.terracotta .ch-num { color: var(--terracotta); }
.chapter-card.bordeaux .ch-num { color: var(--bordeaux); }

.chapter-card .ch-title {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 20px;
  margin: 2px 0 4px 0;
  line-height: 1.2;
}
.chapter-card .ch-sub {
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 14px;
}

.chapter-card .ch-progress {
  display: flex;
  gap: 14px;
  align-items: center;
  flex-wrap: wrap;
}
.chapter-card .mini-bar {
  flex: 1;
  min-width: 80px;
  height: 6px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.chapter-card .mini-bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.4s;
}
.chapter-card.ocher .mini-bar-fill { background: var(--ocher); }
.chapter-card.moss .mini-bar-fill { background: var(--moss); }
.chapter-card.terracotta .mini-bar-fill { background: var(--terracotta); }
.chapter-card.bordeaux .mini-bar-fill { background: var(--bordeaux); }

.chapter-card .ch-stats {
  font-size: 13px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.chapter-card .ch-doelen {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.doel-pill {
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.doel-pill.good { background: var(--good-bg); color: var(--good); }
.doel-pill.warn { background: var(--warn-bg); color: var(--warn); }
.doel-pill.bad  { background: var(--bad-bg);  color: var(--bad); }
.doel-pill.neutral { background: var(--line); color: var(--ink-faint); }

/* Mix toets card */
.mix-card {
  background: var(--ink);
  color: var(--bg);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  text-align: left;
  font-family: inherit;
  width: 100%;
  border: none;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s, box-shadow 0.15s;
}
.mix-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-med); }
.mix-card .mix-eyebrow {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 4px;
  font-weight: 600;
}
.mix-card .mix-title {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 22px;
  margin-bottom: 6px;
}
.mix-card .mix-sub {
  font-size: 14px;
  opacity: 0.75;
}
.mix-card .mix-arrow {
  position: absolute;
  right: 22px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 20px;
  opacity: 0.6;
}

/* ============================================================
   CHAPTER DETAIL VIEW
   ============================================================ */
.chapter-header {
  padding: 8px 4px 20px 4px;
}
.chapter-header .ch-num {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.chapter-header.ocher .ch-num { color: var(--ocher); }
.chapter-header.moss .ch-num { color: var(--moss); }
.chapter-header.terracotta .ch-num { color: var(--terracotta); }
.chapter-header.bordeaux .ch-num { color: var(--bordeaux); }
.chapter-header h1 {
  font-size: clamp(24px, 6vw, 32px);
  line-height: 1.15;
  margin: 4px 0 6px 0;
}
.chapter-header .sub {
  color: var(--ink-soft);
  font-size: 15px;
}

.mode-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: var(--bg-card);
  padding: 4px;
  border-radius: var(--radius);
  margin-bottom: 20px;
  border: 1px solid var(--line);
}
.mode-tab {
  background: none;
  border: none;
  padding: 10px 8px;
  border-radius: calc(var(--radius) - 4px);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  color: var(--ink-soft);
  transition: all 0.15s;
}
.mode-tab.active {
  background: var(--bg-elevated);
  color: var(--ink);
  box-shadow: var(--shadow-soft);
}

/* ============================================================
   THEORY VIEW
   ============================================================ */
.theory-block {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 10px;
}
.theory-block h3 {
  font-size: 18px;
  margin-bottom: 8px;
  line-height: 1.3;
}
.theory-block p {
  color: var(--ink);
  font-size: 15px;
  line-height: 1.55;
}
.theory-warning {
  background: linear-gradient(to right, var(--warn-bg), transparent 80%);
  border-left: 3px solid var(--warn);
  padding: 10px 14px;
  margin-top: 12px;
  border-radius: 4px;
  font-size: 14px;
  color: var(--ink);
  line-height: 1.5;
}

.terms-section {
  margin-top: 20px;
}
.terms-section h2 {
  font-size: 20px;
  margin-bottom: 12px;
}
.term-item {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin-bottom: 6px;
}
.term-item .t {
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--ink);
}
.term-item .d {
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.5;
}

/* ============================================================
   BEGRIPPEN TRAINER (FLASHCARDS)
   ============================================================ */
.trainer-setup {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}
.trainer-setup label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  cursor: pointer;
  padding: 8px 0;
}
.trainer-setup input[type=radio] { accent-color: var(--ink); }

.flashcard-wrap {
  perspective: 1200px;
  margin: 20px 0;
  min-height: 280px;
}
.flashcard {
  background: var(--bg-elevated);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  min-height: 240px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow-soft);
  position: relative;
  transition: transform 0.5s;
  transform-style: preserve-3d;
}
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard .face {
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  position: absolute;
  inset: 28px 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.flashcard .back { transform: rotateY(180deg); }
.flashcard .label {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 12px;
  font-weight: 600;
}
.flashcard .content {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 22px;
  line-height: 1.3;
  color: var(--ink);
}
.flashcard .content.def {
  font-family: 'Inter Tight', sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
.flashcard .hint {
  position: absolute;
  bottom: 14px;
  font-size: 12px;
  color: var(--ink-faint);
}

.flashcard-actions {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 16px;
}
.flashcard-actions button {
  padding: 12px 8px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--bg-card);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--ink);
}
.flashcard-actions button:active { transform: translateY(1px); }
.flashcard-actions .again { border-color: var(--bad-bg); color: var(--bad); }
.flashcard-actions .again:hover { background: var(--bad-bg); }
.flashcard-actions .hard { border-color: var(--warn-bg); color: var(--warn); }
.flashcard-actions .hard:hover { background: var(--warn-bg); }
.flashcard-actions .good { border-color: var(--good-bg); color: var(--good); }
.flashcard-actions .good:hover { background: var(--good-bg); }

.trainer-progress {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}
.trainer-progress .bar {
  height: 4px;
  background: var(--line);
  border-radius: 999px;
  margin-top: 6px;
  overflow: hidden;
}
.trainer-progress .bar-fill {
  height: 100%;
  background: var(--ink);
  border-radius: 999px;
  transition: width 0.3s;
}

/* ============================================================
   LEERDOELEN CHECK
   ============================================================ */
.doelen-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.doel-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  width: 100%;
  color: inherit;
  transition: background 0.15s, border-color 0.15s;
  display: flex;
  gap: 12px;
  align-items: center;
}
.doel-card:hover { border-color: var(--line-strong); }
.doel-card .doel-status {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  background: var(--line);
  color: var(--ink-faint);
}
.doel-card .doel-status.good { background: var(--good-bg); color: var(--good); }
.doel-card .doel-status.warn { background: var(--warn-bg); color: var(--warn); }
.doel-card .doel-status.bad  { background: var(--bad-bg);  color: var(--bad); }
.doel-card .doel-text {
  flex: 1;
  font-size: 14px;
  line-height: 1.4;
}
.doel-card .doel-arrow { color: var(--ink-faint); }

/* Quiz / question rendering */
.quiz-progress-bar {
  height: 4px;
  background: var(--line);
  border-radius: 999px;
  margin-bottom: 20px;
  overflow: hidden;
}
.quiz-progress-bar-fill {
  height: 100%;
  background: var(--ink);
  border-radius: 999px;
  transition: width 0.3s;
}
.quiz-meta {
  font-size: 13px;
  color: var(--ink-faint);
  margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 600;
}

.question-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.question-card .q-text {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 19px;
  line-height: 1.35;
  margin-bottom: 16px;
}

.mc-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.mc-option {
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  text-align: left;
  font-family: inherit;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--ink);
  line-height: 1.4;
}
.mc-option:hover { border-color: var(--ink-soft); background: var(--bg-card); }
.mc-option.selected { border-color: var(--ink); background: var(--bg-card); }
.mc-option.correct {
  border-color: var(--good);
  background: var(--good-bg);
  color: var(--good);
  font-weight: 600;
}
.mc-option.incorrect {
  border-color: var(--bad);
  background: var(--bad-bg);
  color: var(--bad);
}
.mc-option:disabled { cursor: default; }

.open-input {
  width: 100%;
  min-height: 80px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-family: inherit;
  font-size: 15px;
  resize: vertical;
  background: var(--bg-elevated);
  color: var(--ink);
}
.open-input:focus {
  outline: 2px solid var(--ink);
  outline-offset: 1px;
}

.answer-reveal {
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-left: 3px solid var(--good);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-top: 12px;
  font-size: 15px;
  line-height: 1.5;
}
.answer-reveal .label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--good);
  margin-bottom: 6px;
}

.self-rating {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}
.self-rating button {
  padding: 10px 6px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;

            { type: "open", q: "Noem een argument vóór en een argument tegen boren naar olie en gas in het Noordpoolgebied.", answer: "Vóór: economisch belangrijk (grote olie/gasvoorraden), en de Noordelijke Doorvaart wordt aantrekkelijker. Tegen: kwetsbare natuur wordt beschadigd, fauna verstoord, leefgebied van oorspronkelijke bewoners (Groenlanders) bedreigd, risico op olielekkages in een gebied waar opruimen extra moeilijk is." }

<script>
// ============================================================
// AARDRIJKSKUNDE LEERTOOL — APP LOGICA
// ============================================================

// ---- STATE & STORAGE ----
const STORAGE_KEY = 'ak_leertool_v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return { ...defaultState(), ...parsed };
  } catch {
    return defaultState();
  }
}

function defaultState() {
  return {
    terms: {}, // { 'h1-welvaart': { status: 'new'|'learning'|'known', seen: 0 } }
    objectives: {}, // { 'h1-d1': { status: 'red'|'orange'|'green', lastScore: 0.66 } }
    lastMix: null, // { date, score, perChapter: {h1: 0.8, ...} }
  };
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('Kon voortgang niet opslaan:', e);
  }
}

let state = loadState();

// ---- NAVIGATIE ----
const viewStack = []; // history voor terug-knop

function showView(viewId, ctx) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const view = document.getElementById(viewId);
  if (!view) return;
  view.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'instant' });

  // render content
  if (viewId === 'view-dashboard') renderDashboard();
  if (viewId === 'view-chapter') renderChapter(ctx);
  if (viewId === 'view-trainer') renderTrainer(ctx);
  if (viewId === 'view-doel-quiz') renderDoelQuiz(ctx);
  if (viewId === 'view-mix') renderMix(ctx);
}

function navTo(viewId, ctx) {
  viewStack.push({ viewId: currentView(), ctx: currentCtx });
  currentCtx = ctx;
  showView(viewId, ctx);
}

function navBack() {
  const prev = viewStack.pop();
  if (prev) {
    currentCtx = prev.ctx;
    showView(prev.viewId, prev.ctx);
  } else {
    currentCtx = null;
    showView('view-dashboard');
  }
}

let currentCtx = null;
function currentView() {
  const active = document.querySelector('.view.active');
  return active ? active.id : 'view-dashboard';
}

// ---- HELPERS ----
function getChapter(id) {
  return DATA.chapters.find(c => c.id === id);
}

function chapterProgress(ch) {
  const objs = ch.objectives;
  const counts = { good: 0, warn: 0, bad: 0, neutral: 0 };
  for (const o of objs) {
    const st = state.objectives[o.id];
    if (!st) counts.neutral++;
    else if (st.status === 'green') counts.good++;
    else if (st.status === 'orange') counts.warn++;
    else counts.bad++;
  }
  const total = objs.length;
  // Voortgang: green telt vol, orange half, rest niet
  const score = (counts.good + counts.warn * 0.5) / total;

  // Begrippen voortgang
  const termIds = ch.terms.map(t => ch.id + '-' + t.term);
  const knownTerms = termIds.filter(id => state.terms[id]?.status === 'known').length;

  return {
    objectives: counts,
    objectiveTotal: total,
    objectiveScore: score,
    termsKnown: knownTerms,
    termsTotal: ch.terms.length,
  };
}

function overallProgress() {
  let totalScore = 0, totalCount = 0;
  let goodCount = 0, warnCount = 0, badCount = 0, neutralCount = 0;
  let termsKnown = 0, termsTotal = 0;

  for (const ch of DATA.chapters) {
    const p = chapterProgress(ch);
    totalScore += p.objectiveScore;
    totalCount += 1;
    goodCount += p.objectives.good;
    warnCount += p.objectives.warn;
    badCount += p.objectives.bad;
    neutralCount += p.objectives.neutral;
    termsKnown += p.termsKnown;
    termsTotal += p.termsTotal;
  }
  return {
    pct: Math.round(totalScore / totalCount * 100),
    goodCount, warnCount, badCount, neutralCount,
    termsKnown, termsTotal,
  };
}

// Shuffle helper
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---- DASHBOARD RENDER ----
function renderDashboard() {
  document.querySelector('.topbar .back').style.display = 'none';
  document.querySelector('.topbar .title').textContent = 'Aardrijkskunde — Toetsweek T3';
  document.querySelector('.topbar .badge').textContent = '';

  const overall = overallProgress();

  // Aanmoedigend bericht
  let msg;
  if (overall.pct === 0) msg = "Begin met een hoofdstuk om de tool te leren kennen.";
  else if (overall.pct < 30) msg = "Je bent net begonnen — goed bezig!";
  else if (overall.pct < 60) msg = "Lekker bezig — blijf oefenen.";
  else if (overall.pct < 85) msg = "Aardig op weg naar de toets!";
  else msg = "Sterk! Je bent goed voorbereid.";

  let html = `
    <div class="hero">
      <div class="eyebrow">Klas 3 vmbo-t</div>
      <h1>Aardrijkskunde<br>Toetsweek 3</h1>
      <div class="sub">Bruggen — hoofdstukken 1, 3, 5 en 6</div>
    </div>

    <div class="overall-progress">
      <div class="label">Klaar voor de toets</div>
      <div class="pct">${overall.pct}%</div>
      <div class="bar"><div class="bar-fill" style="width: ${overall.pct}%"></div></div>
      <div class="stats">
        <span><strong>${overall.goodCount}</strong> doelen op groen</span>
        <span><strong>${overall.warnCount}</strong> op oranje</span>
        <span><strong>${overall.badCount}</strong> op rood</span>
        <span><strong>${overall.termsKnown}</strong> / ${overall.termsTotal} begrippen</span>
      </div>
    </div>

    <div class="section-title">Hoofdstukken</div>
    <div class="chapter-grid">
  `;

  for (const ch of DATA.chapters) {
    const p = chapterProgress(ch);
    const pct = Math.round(p.objectiveScore * 100);
    html += `
      <button class="chapter-card ${ch.color}" data-action="open-chapter" data-id="${ch.id}">
        <div class="accent"></div>
        <div class="ch-num">Hoofdstuk ${ch.number}</div>
        <div class="ch-title">${ch.title}</div>
        <div class="ch-sub">${ch.subtitle}</div>
        <div class="ch-progress">
          <div class="mini-bar"><div class="mini-bar-fill" style="width: ${pct}%"></div></div>
          <div class="ch-stats">${pct}% · ${p.termsKnown}/${p.termsTotal} begrippen</div>
        </div>
        <div class="ch-doelen">
          ${p.objectives.good ? `<span class="doel-pill good">${p.objectives.good} groen</span>` : ''}
          ${p.objectives.warn ? `<span class="doel-pill warn">${p.objectives.warn} oranje</span>` : ''}
          ${p.objectives.bad ? `<span class="doel-pill bad">${p.objectives.bad} rood</span>` : ''}
          ${p.objectives.neutral ? `<span class="doel-pill neutral">${p.objectives.neutral} onbekend</span>` : ''}
        </div>
      </button>
    `;
  }

  html += `</div>
    <button class="mix-card" data-action="open-mix">
      <div class="mix-eyebrow">Toetssimulatie</div>
      <div class="mix-title">Mix-toets</div>
      <div class="mix-sub">25 vragen door alle hoofdstukken heen</div>
      <span class="mix-arrow">→</span>
    </button>

    <div class="footer-link">
      <button data-action="reset">Voortgang wissen</button>
    </div>
  `;

  document.getElementById('view-dashboard').innerHTML = html;
}

// ---- CHAPTER DETAIL RENDER ----
function renderChapter(ctx) {
  const ch = getChapter(ctx.chapterId);
  document.querySelector('.topbar .back').style.display = 'inline-flex';
  document.querySelector('.topbar .title').textContent = `H${ch.number} ${ch.title}`;
  document.querySelector('.topbar .badge').textContent = '';

  const tab = ctx.tab || 'theorie';
  const p = chapterProgress(ch);

  let html = `
    <div class="chapter-header ${ch.color}">
      <div class="ch-num">Hoofdstuk ${ch.number}</div>
      <h1>${ch.title}</h1>
      <div class="sub">${ch.subtitle}</div>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab ${tab === 'theorie' ? 'active' : ''}" data-action="set-tab" data-tab="theorie">Theorie</button>
      <button class="mode-tab ${tab === 'begrippen' ? 'active' : ''}" data-action="set-tab" data-tab="begrippen">Begrippen</button>
      <button class="mode-tab ${tab === 'doelen' ? 'active' : ''}" data-action="set-tab" data-tab="doelen">Leerdoelen</button>
    </div>
  `;

  if (tab === 'theorie') {
    for (const t of ch.theory) {
      html += `
        <div class="theory-block">
          <h3>${t.heading}</h3>
          <p>${t.body}</p>
          ${t.warning ? `<div class="theory-warning">⚠ ${t.warning}</div>` : ''}
        </div>
      `;
    }
    html += `
      <div class="terms-section">
        <h2>Alle begrippen op een rij</h2>
    `;
    for (const term of ch.terms) {
      html += `
        <div class="term-item">
          <div class="t">${term.term}</div>
          <div class="d">${term.definition}</div>
        </div>
      `;
    }
    html += `</div>`;
  } else if (tab === 'begrippen') {
    html += `
      <div class="trainer-setup">
        <div style="font-weight: 600; margin-bottom: 8px;">Hoe wil je oefenen?</div>
        <label>
          <input type="radio" name="direction" value="term-to-def" checked>
          Begrip → definitie (makkelijker)
        </label>
        <label>
          <input type="radio" name="direction" value="def-to-term">
          Definitie → begrip (zoals op de toets)
        </label>
        <label>
          <input type="radio" name="direction" value="mix">
          Door elkaar
        </label>
      </div>
      <div style="margin-bottom: 12px; font-size: 14px; color: var(--ink-soft);">
        ${p.termsKnown} van ${p.termsTotal} begrippen al beheerst.
      </div>
      <button class="btn-primary" data-action="start-trainer" data-chapter="${ch.id}">
        ${p.termsKnown > 0 ? 'Doorgaan met oefenen' : 'Start oefenen'}
      </button>
      ${p.termsKnown > 0 ? `<button class="btn-secondary" data-action="reset-terms" data-chapter="${ch.id}">Begrippen opnieuw beginnen</button>` : ''}
    `;
  } else if (tab === 'doelen') {
    html += `<div class="doelen-list">`;
    for (const o of ch.objectives) {
      const st = state.objectives[o.id];
      let statusClass = 'neutral';
      let statusIcon = '?';
      if (st) {
        if (st.status === 'green') { statusClass = 'good'; statusIcon = '✓'; }
        else if (st.status === 'orange') { statusClass = 'warn'; statusIcon = '~'; }
        else { statusClass = 'bad'; statusIcon = '✗'; }
      }
      html += `
        <button class="doel-card" data-action="start-doel" data-doel="${o.id}" data-chapter="${ch.id}">
          <div class="doel-status ${statusClass}">${statusIcon}</div>
          <div class="doel-text">${o.text}</div>
          <div class="doel-arrow">→</div>
        </button>
      `;
    }
    html += `</div>`;
  }

  document.getElementById('view-chapter').innerHTML = html;
}

// ---- BEGRIPPEN TRAINER ----
let trainer = null;

function startTrainer(chapterId, direction) {
  const ch = getChapter(chapterId);
  // Lijst: begrippen die nog niet 'known' zijn, plus alle voor herhaling
  const cards = ch.terms.map(t => {
    const id = ch.id + '-' + t.term;
    const tState = state.terms[id] || { status: 'new', seen: 0 };
    return {
      id,
      term: t.term,
      definition: t.definition,
      chapterId: ch.id,
      status: tState.status,
    };
  }).filter(c => c.status !== 'known');

  if (cards.length === 0) {
    // alle bekend — biedt aan opnieuw te beginnen
    document.getElementById('view-trainer').innerHTML = `
      <div class="empty">
        <div class="icon">✓</div>
        <h2>Alles geleerd!</h2>
        <p>Je hebt alle begrippen van dit hoofdstuk beheerst.</p>
        <button class="btn-secondary" data-action="reset-terms" data-chapter="${ch.id}" style="max-width: 280px; margin: 16px auto 0; display: block;">Opnieuw beginnen</button>
      </div>
    `;
    return;
  }

  trainer = {
    chapter: ch,
    direction,
    queue: shuffle(cards),
    initialTotal: cards.length,
    completed: 0,
    flipped: false,
  };
  renderTrainerCard();
}

function renderTrainer(ctx) {
  const ch = getChapter(ctx.chapterId);
  document.querySelector('.topbar .back').style.display = 'inline-flex';
  document.querySelector('.topbar .title').textContent = `H${ch.number} — Begrippen`;
  startTrainer(ctx.chapterId, ctx.direction);
}

function renderTrainerCard() {
  if (!trainer || trainer.queue.length === 0) {
    // klaar voor nu
    document.getElementById('view-trainer').innerHTML = `
      <div class="empty">
        <div class="icon">✓</div>
        <h2>Sessie klaar!</h2>
        <p>Je hebt ${trainer.completed} begrip${trainer.completed !== 1 ? 'pen' : ''} geoefend.</p>
        <button class="btn-primary" data-action="back" style="max-width: 280px; margin: 16px auto 0; display: block;">Terug naar hoofdstuk</button>
      </div>
    `;
    return;
  }

  const card = trainer.queue[0];
  const remaining = trainer.queue.length;
  const progress = trainer.completed / (trainer.completed + remaining);

  // Welke kant zichtbaar?
  let frontText, frontLabel, backText, backLabel;
  let frontClass = 'content', backClass = 'content def';
  const dir = trainer.direction === 'mix'
    ? (Math.random() < 0.5 ? 'term-to-def' : 'def-to-term')
    : trainer.direction;

  if (dir === 'term-to-def') {
    frontLabel = 'Begrip';
    frontText = card.term;
    backLabel = 'Definitie';
    backText = card.definition;
  } else {
    frontLabel = 'Definitie';
    frontText = card.definition;
    frontClass = 'content def';
    backLabel = 'Begrip';
    backText = card.term;
    backClass = 'content';
  }

  document.getElementById('view-trainer').innerHTML = `
    <div class="trainer-progress">
      <span>Sessie: ${trainer.completed} / ${trainer.initialTotal}</span>
      <span>Nog ${remaining}</span>
    </div>
    <div class="trainer-progress" style="margin-bottom: 14px;">
      <div class="bar" style="flex:1;"><div class="bar-fill" style="width: ${progress * 100}%"></div></div>
    </div>

    <div class="flashcard-wrap">
      <div class="flashcard" id="flashcard" data-action="flip-card">
        <div class="face front">
          <div class="label">${frontLabel}</div>
          <div class="${frontClass}">${frontText}</div>
          <div class="hint">Tik om te draaien</div>
        </div>
        <div class="face back">
          <div class="label">${backLabel}</div>
          <div class="${backClass}">${backText}</div>
          <div class="hint">Hoe ging het?</div>
        </div>
      </div>
    </div>

    <div class="flashcard-actions" id="flashcard-actions" style="display: none;">
      <button class="again" data-action="rate-card" data-rate="again">Opnieuw</button>
      <button class="hard" data-action="rate-card" data-rate="hard">Bijna</button>
      <button class="good" data-action="rate-card" data-rate="good">Goed</button>
    </div>
  `;
}

function flipCard() {
  const card = document.getElementById('flashcard');
  if (!card) return;
  card.classList.toggle('flipped');
  const actions = document.getElementById('flashcard-actions');
  if (card.classList.contains('flipped')) {
    actions.style.display = 'grid';
  }
}

function rateCard(rate) {
  if (!trainer) return;
  const card = trainer.queue.shift();

  // Spaced repetition light
  const tState = state.terms[card.id] || { status: 'new', seen: 0 };
  tState.seen++;

  if (rate === 'good') {
    tState.status = 'known';
    trainer.completed++;
  } else if (rate === 'hard') {
    tState.status = 'learning';
    // Plaats kaart 3 posities verder in de queue
    const insertAt = Math.min(3, trainer.queue.length);
    trainer.queue.splice(insertAt, 0, card);
  } else {
    // 'again' — kaart komt 1 positie verder terug
    tState.status = 'learning';
    const insertAt = Math.min(1, trainer.queue.length);
    trainer.queue.splice(insertAt, 0, card);
  }
  state.terms[card.id] = tState;
  saveState();

  renderTrainerCard();
}

// ---- LEERDOELEN-CHECK ----
let quiz = null;

function startDoelQuiz(chapterId, doelId) {
  const ch = getChapter(chapterId);
  const doel = ch.objectives.find(o => o.id === doelId);
  if (!doel) return;
  quiz = {
    chapter: ch,
    doel,
    questions: doel.questions,
    current: 0,
    results: [], // {correct: bool|null, type, self?}
    answered: false,
  };
  renderQuizQuestion();
}

function renderDoelQuiz(ctx) {
  const ch = getChapter(ctx.chapterId);
  document.querySelector('.topbar .back').style.display = 'inline-flex';
  document.querySelector('.topbar .title').textContent = `H${ch.number} — Leerdoel`;
  startDoelQuiz(ctx.chapterId, ctx.doelId);
}

function renderQuizQuestion() {
  if (!quiz) return;
  if (quiz.current >= quiz.questions.length) {
    finishDoelQuiz();
    return;
  }

  const q = quiz.questions[quiz.current];
  const progress = quiz.current / quiz.questions.length;

  let html = `
    <div class="quiz-progress-bar">
      <div class="quiz-progress-bar-fill" style="width: ${progress * 100}%"></div>
    </div>
    <div class="quiz-meta">Leerdoel · vraag ${quiz.current + 1} van ${quiz.questions.length}</div>
    <div style="font-size: 14px; color: var(--ink-soft); margin-bottom: 16px; line-height: 1.4;">${quiz.doel.text}</div>

    <div class="question-card">
      <div class="q-text">${q.q}</div>
  `;

  if (q.type === 'mc') {
    html += `<div class="mc-options" id="mc-options">`;
    q.options.forEach((opt, i) => {
      html += `<button class="mc-option" data-action="mc-answer" data-idx="${i}">${opt}</button>`;
    });
    html += `</div>`;
  } else {
    html += `
      <textarea class="open-input" id="open-input" placeholder="Typ hier je antwoord… (of denk het in je hoofd en klik 'Toon antwoord')"></textarea>
      <button class="btn-primary" data-action="reveal-answer">Toon antwoord</button>
    `;
  }

  html += `</div>`;
  document.getElementById('view-doel-quiz').innerHTML = html;
  quiz.answered = false;
}

function answerMC(idx) {
  if (!quiz || quiz.answered) return;
  const q = quiz.questions[quiz.current];
  const correct = idx === q.correct;
  quiz.results.push({ correct, type: 'mc' });
  quiz.answered = true;

  const opts = document.querySelectorAll('.mc-option');
  opts.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct) btn.classList.add('correct');
    if (i === idx && !correct) btn.classList.add('incorrect');
  });

  // Wacht even en toon volgende
  setTimeout(() => {
    quiz.current++;
    renderQuizQuestion();
  }, 1400);
}

function revealAnswer() {
  if (!quiz || quiz.answered) return;
  const q = quiz.questions[quiz.current];
  quiz.answered = true;

  // Render in plaats van textarea: het antwoord + zelfevaluatie
  const card = document.querySelector('.question-card');
  if (!card) return;
  card.querySelector('.btn-primary').remove();
  const userInput = document.getElementById('open-input');
  if (userInput) userInput.disabled = true;

  const div = document.createElement('div');
  div.innerHTML = `
    <div class="answer-reveal">
      <div class="label">Modelantwoord</div>
      ${q.answer}
    </div>
    <div style="margin-top: 12px; font-size: 14px; color: var(--ink-soft);">Hoe deed jij het?</div>
    <div class="self-rating">
      <button class="had-niet" data-action="self-rate" data-rate="niet">Had ik niet</button>
      <button class="had-deels" data-action="self-rate" data-rate="deels">Deels</button>
      <button class="had-wel" data-action="self-rate" data-rate="wel">Had ik</button>
    </div>
  `;
  card.appendChild(div);
}

function selfRate(rate) {
  if (!quiz) return;
  let correct;
  if (rate === 'wel') correct = true;
  else if (rate === 'deels') correct = 0.5;
  else correct = false;
  quiz.results.push({ correct, type: 'open', self: rate });
  setTimeout(() => {
    quiz.current++;
    renderQuizQuestion();
  }, 300);
}

function finishDoelQuiz() {
  if (!quiz) return;
  // Score berekenen (correct kan true/false/0.5 zijn)
  let total = 0;
  for (const r of quiz.results) {
    total += r.correct === true ? 1 : r.correct === 0.5 ? 0.5 : 0;
  }
  const pct = total / quiz.questions.length;

  let status;
  if (pct >= 0.85) status = 'green';
  else if (pct >= 0.5) status = 'orange';
  else status = 'red';

  state.objectives[quiz.doel.id] = { status, lastScore: pct };
  saveState();

  const pctRound = Math.round(pct * 100);
  let scoreClass, msg;
  if (status === 'green') {
    scoreClass = 'good';
    msg = 'Sterk! Dit leerdoel beheers je goed.';
  } else if (status === 'orange') {
    scoreClass = 'warn';
    msg = 'Op de goede weg. Bekijk de theorie en oefen dit leerdoel nog eens.';
  } else {
    scoreClass = 'bad';
    msg = 'Hier kun je nog winst halen. Lees de theorie van dit hoofdstuk goed door en probeer dit leerdoel later opnieuw.';
  }

  document.getElementById('view-doel-quiz').innerHTML = `
    <div class="result-card">
      <div class="score-label">Resultaat</div>
      <div class="score-num ${scoreClass}">${pctRound}%</div>
      <div style="font-size: 13px; color: var(--ink-faint); margin-top: 4px;">
        ${quiz.doel.text}
      </div>
      <div class="score-msg">${msg}</div>
    </div>
    <button class="btn-primary" data-action="back">Terug</button>
    <button class="btn-secondary" data-action="retry-doel" data-doel="${quiz.doel.id}" data-chapter="${quiz.chapter.id}">Nog een keer</button>
  `;

  quiz = null;
}

// ---- MIX-TOETS ----
let mix = null;

function startMix() {
  // Bouw een gevarieerde set van 25 vragen: ongeveer evenredig over hoofdstukken
  const allQ = [];
  for (const ch of DATA.chapters) {
    for (const o of ch.objectives) {
      for (const q of o.questions) {
        allQ.push({ ...q, chapterId: ch.id, doelId: o.id, chapterColor: ch.color, chapterNum: ch.number });
      }
    }
  }
  // Per hoofdstuk evenredig trekken
  const perChapter = {};
  for (const ch of DATA.chapters) {
    perChapter[ch.id] = shuffle(allQ.filter(q => q.chapterId === ch.id)).slice(0, 7);
  }
  // Combineren tot ~25, daarna shuffelen
  let combined = [];
  for (const id in perChapter) combined = combined.concat(perChapter[id]);
  combined = shuffle(combined).slice(0, 25);

  mix = {
    questions: combined,
    current: 0,
    results: [],
    answered: false,
  };
  renderMixQuestion();
}

function renderMix(ctx) {
  document.querySelector('.topbar .back').style.display = 'inline-flex';
  document.querySelector('.topbar .title').textContent = 'Mix-toets';
  startMix();
}

function renderMixQuestion() {
  if (!mix) return;
  if (mix.current >= mix.questions.length) {
    finishMix();
    return;
  }
  const q = mix.questions[mix.current];
  const progress = mix.current / mix.questions.length;

  let html = `
    <div class="quiz-progress-bar">
      <div class="quiz-progress-bar-fill" style="width: ${progress * 100}%"></div>
    </div>
    <div class="quiz-meta">Vraag ${mix.current + 1} van ${mix.questions.length} · H${q.chapterNum}</div>

    <div class="question-card">
      <div class="q-text">${q.q}</div>
  `;

  if (q.type === 'mc') {
    html += `<div class="mc-options">`;
    q.options.forEach((opt, i) => {
      html += `<button class="mc-option" data-action="mix-mc" data-idx="${i}">${opt}</button>`;
    });
    html += `</div>`;
  } else {
    html += `
      <textarea class="open-input" id="open-input" placeholder="Typ hier je antwoord, of denk het en klik dan 'Toon antwoord'"></textarea>
      <button class="btn-primary" data-action="mix-reveal">Toon antwoord</button>
    `;
  }

  html += `</div>`;
  document.getElementById('view-mix').innerHTML = html;
  mix.answered = false;
}

function mixAnswerMC(idx) {
  if (!mix || mix.answered) return;
  const q = mix.questions[mix.current];
  const correct = idx === q.correct;
  mix.results.push({ correct, chapterId: q.chapterId, type: 'mc' });
  mix.answered = true;

  const opts = document.querySelectorAll('.mc-option');
  opts.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct) btn.classList.add('correct');
    if (i === idx && !correct) btn.classList.add('incorrect');
  });

  setTimeout(() => {
    mix.current++;
    renderMixQuestion();
  }, 1200);
}

function mixReveal() {
  if (!mix || mix.answered) return;
  const q = mix.questions[mix.current];
  mix.answered = true;
  const card = document.querySelector('.question-card');
  if (!card) return;
  card.querySelector('.btn-primary').remove();
  const input = document.getElementById('open-input');
  if (input) input.disabled = true;
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="answer-reveal">
      <div class="label">Modelantwoord</div>
      ${q.answer}
    </div>
    <div style="margin-top: 12px; font-size: 14px; color: var(--ink-soft);">Hoe deed jij het?</div>
    <div class="self-rating">
      <button class="had-niet" data-action="mix-self" data-rate="niet">Had ik niet</button>
      <button class="had-deels" data-action="mix-self" data-rate="deels">Deels</button>
      <button class="had-wel" data-action="mix-self" data-rate="wel">Had ik</button>
    </div>
  `;
  card.appendChild(div);
}

function mixSelfRate(rate) {
  if (!mix) return;
  const q = mix.questions[mix.current];
  let correct;
  if (rate === 'wel') correct = true;
  else if (rate === 'deels') correct = 0.5;
  else correct = false;
  mix.results.push({ correct, chapterId: q.chapterId, type: 'open', self: rate });
  setTimeout(() => {
    mix.current++;
    renderMixQuestion();
  }, 300);
}

function finishMix() {
  if (!mix) return;
  let total = 0;
  const perCh = {};
  for (const ch of DATA.chapters) perCh[ch.id] = { score: 0, count: 0 };
  for (const r of mix.results) {
    const val = r.correct === true ? 1 : r.correct === 0.5 ? 0.5 : 0;
    total += val;
    perCh[r.chapterId].score += val;
    perCh[r.chapterId].count += 1;
  }
  const pct = total / mix.questions.length;
  const pctRound = Math.round(pct * 100);

  // bewaar lastMix
  const perChObj = {};
  for (const id in perCh) {
    if (perCh[id].count > 0) {
      perChObj[id] = perCh[id].score / perCh[id].count;
    }
  }
  state.lastMix = { date: new Date().toISOString(), score: pct, perChapter: perChObj };
  saveState();

  let scoreClass, msg;
  if (pct >= 0.75) {
    scoreClass = 'good';
    msg = 'Goed bezig! Op dit niveau ben je goed voorbereid op de toets.';
  } else if (pct >= 0.5) {
    scoreClass = 'warn';
    msg = 'Redelijk, maar er is nog ruimte voor verbetering. Kijk hieronder per hoofdstuk waar je nog kunt oefenen.';
  } else {
    scoreClass = 'bad';
    msg = 'Dit was nog niet sterk genoeg voor de toets. Werk eerst de theorie en leerdoelen door, oefen je begrippen, en probeer dan opnieuw.';
  }

  // Per hoofdstuk advies
  let breakdown = '<div class="mix-breakdown"><h3>Per hoofdstuk</h3>';
  for (const ch of DATA.chapters) {
    const cScore = perCh[ch.id];
    if (cScore.count === 0) continue;
    const cPct = Math.round((cScore.score / cScore.count) * 100);
    breakdown += `
      <div class="mix-row ${ch.color}">
        <div class="dot"></div>
        <div class="name">H${ch.number} — ${ch.title}</div>
        <div class="score">${cPct}%</div>
      </div>
    `;
  }
  breakdown += '</div>';

  // Welk hoofdstuk verdient meeste aandacht?
  let worstCh = null, worstScore = 1;
  for (const ch of DATA.chapters) {
    const cScore = perCh[ch.id];
    if (cScore.count === 0) continue;
    const cPct = cScore.score / cScore.count;
    if (cPct < worstScore) { worstScore = cPct; worstCh = ch; }
  }
  let recommendation = '';
  if (worstCh && worstScore < 0.7) {
    recommendation = `
      <button class="btn-secondary" data-action="open-chapter" data-id="${worstCh.id}">
        Werk aan H${worstCh.number}: ${worstCh.title}
      </button>
    `;
  }

  document.getElementById('view-mix').innerHTML = `
    <div class="result-card">
      <div class="score-label">Mix-toets resultaat</div>
      <div class="score-num ${scoreClass}">${pctRound}%</div>
      <div class="score-msg">${msg}</div>
    </div>
    ${breakdown}
    <button class="btn-primary" data-action="back">Terug naar dashboard</button>
    ${recommendation}
    <button class="btn-secondary" data-action="restart-mix">Nieuwe mix-toets</button>
  `;

  mix = null;
}

// ---- RESET ----
function resetTermsForChapter(chapterId) {
  const ch = getChapter(chapterId);
  if (!ch) return;
  for (const t of ch.terms) {
    delete state.terms[ch.id + '-' + t.term];
  }
  saveState();
  // re-render trainer setup
  renderChapter({ chapterId, tab: 'begrippen' });
}

function resetAll() {
  if (!confirm('Weet je zeker dat je alle voortgang wilt wissen? Dit kun je niet ongedaan maken.')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState();
  showView('view-dashboard');
}

// ---- EVENT DELEGATION ----
document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;

  switch (action) {
    case 'open-chapter':
      navTo('view-chapter', { chapterId: target.dataset.id, tab: 'theorie' });
      break;
    case 'open-mix':
      navTo('view-mix', {});
      break;
    case 'set-tab':
      // niet een navTo, maar een re-render binnen het chapter view
      renderChapter({ ...currentCtx, tab: target.dataset.tab });
      break;
    case 'start-trainer': {
      const direction = document.querySelector('input[name="direction"]:checked')?.value || 'term-to-def';
      navTo('view-trainer', { chapterId: target.dataset.chapter, direction });
      break;
    }
    case 'reset-terms':
      if (confirm('Weet je zeker dat je de begrippen van dit hoofdstuk wilt resetten?')) {
        resetTermsForChapter(target.dataset.chapter);
      }
      break;
    case 'flip-card':
      flipCard();
      break;
    case 'rate-card':
      rateCard(target.dataset.rate);
      break;
    case 'start-doel':
      navTo('view-doel-quiz', { chapterId: target.dataset.chapter, doelId: target.dataset.doel });
      break;
    case 'mc-answer':
      answerMC(parseInt(target.dataset.idx, 10));
      break;
    case 'reveal-answer':
      revealAnswer();
      break;
    case 'self-rate':
      selfRate(target.dataset.rate);
      break;
    case 'retry-doel':
      // herstart zelfde quiz
      navTo('view-doel-quiz', { chapterId: target.dataset.chapter, doelId: target.dataset.doel });
      break;
    case 'restart-mix':
      navTo('view-mix', {});
      break;
    case 'mix-mc':
      mixAnswerMC(parseInt(target.dataset.idx, 10));
      break;
    case 'mix-reveal':
      mixReveal();
      break;
    case 'mix-self':
      mixSelfRate(target.dataset.rate);
      break;
    case 'back':
      navBack();
      break;
    case 'reset':
      resetAll();
      break;
  }
});

// Topbar back-button
document.querySelector('.topbar .back').addEventListener('click', () => {
  navBack();
});

// Topbar scroll effect
window.addEventListener('scroll', () => {
  document.querySelector('.topbar').classList.toggle('scrolled', window.scrollY > 8);
}, { passive: true });

// ---- INIT ----
showView('view-dashboard');

</script>
</body>
</html>
