<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa Rad van Fortuin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        h1 { color: #1a365d; }

        #wheel-container {
            position: relative;
            margin: 20px;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }

        /* De pijl bovenop het rad */
        #pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #e53e3e;
            z-index: 10;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            transition: opacity 0.2s;
        }

        #spin-btn { background-color: #3182ce; }
        #reset-btn { background-color: #718096; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #2d3748;
            height: 30px;
        }

        #counter {
            margin-top: 10px;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <h1>Rad van Europa</h1>
    <div id="counter">Landen over: <span id="count-num">0</span></div>

    <div id="wheel-container">
        <div id="pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <div id="result"></div>

    <div class="controls">
        <button id="spin-btn">Draai aan het rad!</button>
        <button id="reset-btn">Reset Lijst</button>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spin-btn');
        const resetBtn = document.getElementById('reset-btn');
        const resultDiv = document.getElementById('result');
        const countDisplay = document.getElementById('count-num');

        const initialCountries = [
            "Albanië", "Azerbeidzjan", "België", "Bosnië en Herzegovina", "Bulgarije", 
            "Cyprus", "Denemarken", "Duitsland", "Estland", "Finland", "Frankrijk", 
            "Georgië", "Griekenland", "Hongarije", "Ierland", "IJsland", "Italië", 
            "Kazachstan", "Kroatië", "Letland", "Litouwen", "Luxemburg", "Moldavië", 
            "Montenegro", "Nederland", "Noord-Macedonië", "Noorwegen", "Oekraïne", 
            "Oostenrijk", "Polen", "Portugal", "Roemenië", "Rusland", "Servië", 
            "Slovenië", "Slowakije", "Spanje", "Tsjechië", "Turkije", "Verenigd Koninkrijk", 
            "Wit-Rusland", "Zweden", "Zwitserland"
        ];

        let countries = [...initialCountries];
        let currentRotation = 0;
        let isSpinning = false;

        function getRandomColor() {
            const hues = [200, 210, 220, 190, 230]; // Blauwtinten
            return `hsl(${hues[Math.floor(Math.random() * hues.length)]}, ${40 + Math.random() * 30}%, ${50 + Math.random() * 20}%)`;
        }

        // Genereer vaste kleuren zodat het rad niet flikkert bij elke draw
        const colors = initialCountries.map(() => getRandomColor());

        function drawWheel() {
            const numSegments = countries.length;
            const arc = (2 * Math.PI) / numSegments;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (numSegments === 0) {
                resultDiv.innerText = "Alle landen zijn op!";
                spinBtn.disabled = true;
                return;
            }

            countries.forEach((country, i) => {
                const angle = i * arc;
                
                // Teken partje
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(250, 250);
                ctx.arc(250, 250, 240, angle, angle + arc);
                ctx.lineTo(250, 250);
                ctx.fill();
                ctx.stroke();

                // Teken tekst
                ctx.save();
                ctx.translate(250, 250);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = numSegments > 20 ? "10px Arial" : "14px Arial";
                ctx.shadowColor = "black";
                ctx.shadowBlur = 2;
                ctx.fillText(country, 230, 5);
                ctx.restore();
            });
            
            countDisplay.innerText = numSegments;
        }

        function spin() {
            if (isSpinning || countries.length === 0) return;

            isSpinning = true;
            resultDiv.innerText = "Draaien...";
            spinBtn.disabled = true;

            const extraDegrees = Math.floor(3000 + Math.random() * 3000);
            currentRotation += extraDegrees;
            
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Wacht op het einde van de CSS transitie
            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;

                // Bereken welk land is gekozen
                const actualRotation = currentRotation % 360;
                const arcSize = 360 / countries.length;
                
                // De pijl staat bovenaan (270 graden in canvas termen)
                // We moeten de rotatie corrigeren om de index te vinden
                const index = Math.floor((360 - (actualRotation % 360) + 270) % 360 / arcSize);
                
                const winner = countries[index];
                resultDiv.innerText = `Gekozen: ${winner}!`;

                // Verwijder het land uit de lijst
                countries.splice(index, 1);
                
                // Wacht even met hertekenen zodat de gebruiker het resultaat ziet
                setTimeout(() => {
                    drawWheel();
                }, 1500);

            }, 4000);
        }

        function reset() {
            if (isSpinning) return;
            countries = [...initialCountries];
            resultDiv.innerText = "Lijst hersteld!";
            spinBtn.disabled = false;
            drawWheel();
        }

        spinBtn.addEventListener('click', spin);
        resetBtn.addEventListener('click', reset);

        // Initialisatie
        drawWheel();
    </script>
</body>
</html>
